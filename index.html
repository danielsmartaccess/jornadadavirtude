<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Jornada da Virtude: conhecer o ser humano, compreender as virtudes, aprender com a sabedoria e transformar a vida pela prática." />
    <meta name="theme-color" content="#efebe3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Jornada da Virtude</title>
    <script>
      try {
        var t = localStorage.getItem('jv-theme');
        if (t === 'light' || t === 'dark' || t === 'roxo') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
